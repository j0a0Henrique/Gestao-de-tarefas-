<!DOCTYPE html>
<html lang="pt-BR" ng-app="AppTarefas">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/viewpage.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="js/app.js"></script>
</head>
<!-- Restante do código permanece igual -->
<body ng-controller="TarefasController">

    <header id="header" class="navbar navbar-light shadow-sm header">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="#" class="navbar-brand" id="icon">
                <img src="/views/style/imgs/icon-removebg-preview.png" alt="Logo da aplicação">
            </a>
            <div class="perfil">
                <button class="btn btn-outline-secondary" type="button">
                    <img src="/views/style/imgs/do-utilizador.png" alt="Perfil do usuário">
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="container mt-4">
            <div class="row g-2">
                <div class="col-md-3">
                    <label for="hora" class="form-label">Hora:</label>
                    <input type="time" ng-model="novaTarefa.hora" class="form-control">
                </div>
                <div class="col-md-6">
                    <label for="descricao" class="form-label">Tarefa:</label>
                    <input type="text" id="descricao" ng-model="novaTarefa.descricao" class="form-control"
                           placeholder="Descrição da tarefa" maxlength="50">
                </div>
                <div class="col-md-3">
                    <label for="data" class="form-label">Data:</label>
                    <input type="date" ng-model="novaTarefa.data" class="form-control">
                </div>
            </div>
            <div class="text-center mt-3">
                <button class="btn btn-primary" type="button" ng-click="adicionarTarefa()">Enviar</button>
            </div>
        </section>

        <section class="album py-5 bg-light">
            <div class="container">
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                    <div class="col" ng-repeat="tarefa in tarefas">
                        <div class="card p-3 h-90 w-70">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h1 class="card-title mb-0" id="hora">{{tarefa.hora | date:'HH:mm'}}</h1>
                                <button class="btn btn-sm btn-outline-success" ng-click="concluirTarefa(tarefa.id)"
                                        ng-disabled="tarefa.status === 'concluída'" id="bt1">
                                    <img src="/views/style/imgs/caneta.png" alt="Concluir" width="20">
                                </button>
                            </div>
                            <h4 class="card-text" id="tarefa">{{tarefa.tarefa}}</h4>
                            <h7 class="card-text" id="data"><small>{{tarefa.data | date:'dd/MM/yyyy'}}</small></h7>
                            <div class="d-flex justify-content-between align-items-center">
                                <button class="btn btn-sm btn-outline-danger" id="bt2" ng-click="removerTarefa(tarefa.id)">
                                    <img src="/views/style/imgs/lixeira-de-reciclagem.png" alt="Excluir" width="20">
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="foot" class="text-center mt-auto">
        <p class="mt-4">Gestão de Tarefas Ltda © 2025 by João H.R.R</p>
    </footer>

</body>
</html>
